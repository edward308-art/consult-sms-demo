<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상담 요약 SMS</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e1e6ee;--brand:#0b5cff;--brand-d:#0846c4;
--ok:#0f8a4b;--warn:#b86e00;--bad:#c62828;--chip:#eef3ff;--mark:#fff1b8}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#18202a;--ink:#e8edf4;--mute:#93a0b1;--line:#2a3441;--brand:#5b92ff;--brand-d:#3f78ee;--chip:#1e2b44;--mark:#5a4a12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;min-width:200px}
header label{font-size:12px;color:var(--mute)}
header input{width:110px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--brand)}
main{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--brand);color:#fff;border-radius:99px;width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px}
input,textarea,button,select{font:inherit;color:inherit}
input[type=text],input[type=tel],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.primary:hover{background:var(--brand-d)}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row>*{flex:0 0 auto}.row>.grow{flex:1}
.hint{font-size:12px;color:var(--mute)}
.warn-box{background:#fff4e0;color:#7a4a00;border:1px solid #f3d29a;border-radius:8px;padding:8px 10px;font-size:12px}
@media(prefers-color-scheme:dark){.warn-box{background:#3a2c10;color:#f2cf8b;border-color:#6b5120}}
.err{background:#fdeaea;color:#8a1c1c;border:1px solid #f1b4b4;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
@media(prefers-color-scheme:dark){.err{background:#3a1a1a;color:#f3b4b4;border-color:#6b2a2a}}
.list .it{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.list .it:hover,.list .it.sel{border-color:var(--brand)}
.st{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.st.DRAFT{background:#fff4e0;color:#8a5200}.st.APPROVED{background:#e3f6ec;color:var(--ok)}
.st.SENT{background:#e5ecff;color:var(--brand-d)}.st.REJECTED{background:#fdeaea;color:var(--bad)}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;text-align:center;padding:6px;border-radius:8px;background:var(--bg);color:var(--mute);font-size:12px;border:1px solid var(--line)}
.steps span.on{background:var(--chip);color:var(--brand);border-color:var(--brand);font-weight:600}
.steps span.done{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--chip);color:var(--brand);border-radius:99px;padding:2px 10px;font-size:12px}
.tx{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;font-size:13px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1250px){.two{grid-template-columns:1fr}}
.phone{background:#e9edf3;border-radius:18px;padding:12px;border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.phone{background:#0d1218}}
.bubble{background:#fff;color:#111;border-radius:14px;padding:12px;white-space:pre-wrap;font-size:13px;box-shadow:0 1px 2px #0002}
@media(prefers-color-scheme:dark){.bubble{background:#25303d;color:#e8edf4}}
.rec{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rec label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rec .nm{font-weight:600}.rec .rs{font-size:12px;color:var(--mute)}.rec .nt{font-size:12px;color:var(--warn)}
.checks label{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.tl{font-size:12px;border-left:2px solid var(--line);padding-left:10px}
.tl div{margin:4px 0}.tl b{color:var(--brand)}
.empty{color:var(--mute);text-align:center;padding:40px 0}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
</style>
</head>
<body>
<header>
  <h1>🏦 상담 요약 SMS 발송 시스템 <span class="badge">데모</span></h1>
  <span class="badge" id="cfg"></span>
  <label>직원 ID <input type="text" id="uid" placeholder="예: emp01"></label>
</header>
<div id="banner" class="warn-box" style="display:none;margin:12px 20px 0;max-width:1460px"></div>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:20;place-items:center">
  <div class="card" style="width:min(380px,90vw)"><h2>접속 코드 입력</h2>
    <input type="text" id="code" placeholder="전달받은 접속 코드" autocomplete="off">
    <div id="lerr"></div>
    <div class="row"><button class="primary grow" id="lgo">입장</button></div>
    <div class="hint">공개 테스트 환경입니다. 실제 개인정보는 입력하지 마세요.</div></div>
</div>
<main>
  <section>
    <div class="card">
      <h2>새 상담 입력</h2>
      <div class="row"><span class="hint">샘플:</span><span id="samples"></span></div>
      <textarea id="tx" placeholder="상담 녹취 텍스트(STT 결과)를 붙여넣으세요.&#10;예) 상담원: ...&#10;고객: ..."></textarea>
      <div class="row"><label class="hint grow">고객명(선택, 마스킹 강화)<input type="text" id="cname"></label></div>
      <div class="row"><label class="hint grow">고객 휴대폰(발송용)<input type="tel" id="phone" placeholder="010-0000-0000"></label></div>
      <div class="row"><label><input type="checkbox" id="consent"> 고객이 광고성 정보(상품 추천) 수신에 동의함</label></div>
      <div class="row">
        <label class="hint"><input type="checkbox" id="voiceOn"> 음성 입력(데모)</label>
        <button id="mic" style="display:none">🎙 받아쓰기 시작</button>
      </div>
      <div class="warn-box" id="voiceWarn" style="display:none">브라우저 음성인식은 음성이 외부 서버로 전송될 수 있어 <b>실제 금융 환경에서는 사용하면 안 됩니다.</b> 실서비스는 행내(또는 VPC) STT를 사용합니다.</div>
      <div id="err1"></div>
      <div class="row"><button class="primary grow" id="gen">AI 마스킹 · 요약 · 추천 생성</button></div>
      <div class="hint">원문은 마스킹 직후 폐기되고 마스킹본만 저장됩니다.</div>
    </div>
    <div class="card list"><h2>상담 건 목록</h2><div id="list"></div></div>
    <div class="card"><h2>발송함(모의)</h2><div id="outbox" class="hint">-</div></div>
  </section>
  <section id="detail"><div class="card empty">왼쪽에서 상담을 입력하거나 목록에서 건을 선택하세요.</div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>esc(s).replace(/(\S*\*+\S*|\[비공개\])/g,'<mark>$1</mark>');
let cur=null,dirty=false,CFG={};
const uid=()=>$('#uid').value.trim();
$('#uid').value=localStorage.getItem('uid')||'';
$('#uid').onchange=()=>{try{localStorage.setItem('uid',uid())}catch(e){}};

// ---- 브라우저 보관소: 서버에는 아무것도 저장되지 않는다 ----
const LS='bsms_v1';
let DB={cases:{},order:[],outbox:[]};
try{const x=JSON.parse(localStorage.getItem(LS));if(x&&x.cases)DB=x}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}};
function put(r){DB.cases[r.view.id]={state:r.state,view:r.view};if(!DB.order.includes(r.view.id))DB.order.unshift(r.view.id);save();cur=r.view}

async function api(path,body){
  const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){j={error:'서버 응답을 읽을 수 없습니다(HTTP '+r.status+').'}}
  if(r.status===401&&path!=='/api/login'){$('#login').style.display='grid'}
  if(!r.ok){const e=new Error(j.error||'오류');e.reasons=j.reasons;e.payload=j;throw e}
  return j;
}
const errHtml=e=>`<div class="err"><b>${esc(e.message)}</b>${(e.reasons||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`;
async function act(action,extra){
  const st=DB.cases[cur.id].state;
  const r=await api('/api/act',{action,state:st,actor:uid(),...extra});
  if(r.outbox){DB.outbox.unshift(r.outbox);DB.outbox=DB.outbox.slice(0,20)}
  put(r);return r.view;
}

$('#lgo').onclick=async()=>{try{await api('/api/login',{code:$('#code').value});location.reload()}catch(e){$('#lerr').innerHTML=errHtml(e)}};
$('#code').onkeydown=e=>{if(e.key==='Enter')$('#lgo').click()};

async function init(){
  CFG=await api('/api/config');
  $('#cfg').textContent=`4-eyes ${CFG.four_eyes?'ON':'OFF'} · 요약 규칙기반 · 발송 mock`;
  $('#banner').style.display='';
  $('#banner').innerHTML=CFG.secret_ok
    ?'<b>공개 테스트 환경</b> — <b>가상 데이터만 입력</b>하세요(실제 이름·번호 금지). 문자는 실제로 발송되지 않으며, 입력 내용은 서버에 저장되지 않고 <b>이 브라우저에만</b> 보관됩니다.'
    :'<b>설정 필요:</b> 서버에 APP_SECRET 환경변수(16자 이상)가 없습니다. Vercel 프로젝트 Settings → Environment Variables 에서 추가한 뒤 다시 배포하세요.';
  if(CFG.auth_required&&!CFG.authed){$('#login').style.display='grid';return}
  const s=await api('/api/samples');
  $('#samples').innerHTML=s.map((x,i)=>`<button data-i="${i}">${esc(x.title)}</button>`).join(' ');
  $('#samples').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;
    $('#tx').value=s[i].text;$('#cname').value=s[i].customer_name;$('#phone').value=s[i].phone;};
  refresh();
}
function refresh(){
  const l=DB.order.map(id=>DB.cases[id]&&DB.cases[id].view).filter(Boolean);
  $('#list').innerHTML=(l.length?l.map(c=>`<div class="it ${cur&&cur.id===c.id?'sel':''}" data-id="${c.id}"><span>${c.id}<br><span class="hint">${esc(c.consultant)} · ${c.created_at.slice(5,16).replace('T',' ')}</span></span><span class="st ${c.status}">${c.status}</span></div>`).join(''):'<div class="hint">아직 없습니다.</div>')
    +(l.length?'<div class="row"><button id="wipe">내 브라우저 데이터 모두 삭제</button></div>':'');
  const w=$('#wipe');if(w)w.onclick=()=>{if(confirm('이 브라우저에 저장된 상담 건과 발송함을 모두 삭제합니다.')){DB={cases:{},order:[],outbox:[]};save();cur=null;$('#detail').innerHTML='<div class="card empty">삭제되었습니다.</div>';refresh()}};
  const o=DB.outbox;
  $('#outbox').innerHTML=o.length?`<table>${o.map(x=>`<tr><td>${x.case_id.slice(0,16)}</td><td>${esc(x.to_masked)}</td><td>${x.sent_at.slice(11,16)}</td></tr>`).join('')}</table>`:'-';
}
$('#list').onclick=e=>{const it=e.target.closest('.it');if(!it)return;cur=DB.cases[it.dataset.id].view;dirty=false;render();refresh();};

$('#gen').onclick=async()=>{
  $('#err1').innerHTML='';
  if(!uid()){$('#err1').innerHTML=errHtml({message:'상단에 직원 ID를 입력하세요.'});return}
  $('#gen').disabled=true;
  try{
    const r=await api('/api/cases',{transcript:$('#tx').value,consultant:uid(),recipient:$('#phone').value,customer_name:$('#cname').value,marketing_consent:$('#consent').checked});
    put(r);$('#tx').value='';dirty=false;render();refresh();
  }catch(e){$('#err1').innerHTML=errHtml(e)}
  $('#gen').disabled=false;
};

// 음성 입력(데모)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#voiceOn').onchange=()=>{const on=$('#voiceOn').checked;$('#mic').style.display=on?'':'none';$('#voiceWarn').style.display=on?'':'none';if(on&&!SR){$('#err1').innerHTML=errHtml({message:'이 브라우저는 음성인식을 지원하지 않습니다(Chrome 권장).'})}};
$('#mic').onclick=()=>{
  if(!SR)return;
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('#tx').value+=(($('#tx').value&&!$('#tx').value.endsWith('\n'))?'\n':'')+e.results[i][0].transcript.trim()};
  rec.onend=()=>{rec=null;$('#mic').textContent='🎙 받아쓰기 시작'};
  rec.start();$('#mic').textContent='⏹ 중지';
};

function stepState(){
  const s=cur.status;
  return [['① 생성',1],['② 직원 검토·수정',s==='DRAFT'?0:1],['③ 승인',s==='APPROVED'||s==='SENT'?1:0],['④ 발송',s==='SENT'?1:0]]
   .map(([t,d],i)=>{const active=(s==='DRAFT'&&i===1)||(s==='APPROVED'&&i===3);
     return `<span class="${d?'done':active?'on':''}">${t}</span>`}).join('');
}

function render(){
  const c=cur;if(!c){return}
  const locked=c.status==='SENT'||c.status==='REJECTED';
  const f=Object.entries(c.findings);
  const audit=c.audit||[];
  const needAd=c.has_ad;
  $('#detail').innerHTML=`
  <div class="card"><div class="row"><b style="font-size:16px">${c.id}</b><span class="st ${c.status}">${c.status}</span>
    <span class="hint grow">상담원 ${esc(c.consultant)} · 수신 ${esc(c.recipient_masked)} ${c.reviewer?'· 검토자 '+esc(c.reviewer):''}</span></div>
    <div class="steps">${stepState()}</div></div>

  <div class="two">
   <div>
    <div class="card"><h2><span class="n">A</span>마스킹 결과 <span class="hint">(노란색 = 마스킹됨)</span></h2>
      <div class="chips">${f.length?f.map(([k,v])=>`<span class="chip">${esc(k)} ${v}건</span>`).join(''):'<span class="hint">탐지된 개인정보 없음</span>'}</div>
      <div class="tx">${hl(c.transcript_masked)}</div>
      ${locked?'':`<div class="row"><input type="text" id="extra" class="grow" placeholder="누락된 개인정보 문구를 입력해 추가 마스킹 (쉼표로 구분)"><button id="addMask">추가 마스킹</button></div>`}
    </div>
    <div class="card"><h2><span class="n">B</span>추천 상품 <span class="hint">${c.marketing_consent?'광고 수신 동의 ✔':'수신 동의 없음 → 문자 미포함(직원 참고용)'}</span></h2>
      ${c.recs.length?c.recs.map(r=>`<div class="rec"><label><input type="checkbox" class="recsel" value="${r.id}" ${r.selected?'checked':''} ${(!c.marketing_consent||locked)?'disabled':''}>
        <span><span class="nm">${esc(r.name)}</span> <span class="chip">${esc(r.category)}</span><br>${esc(r.tagline)}<div class="rs">근거: ${esc(r.reason)} · 점수 ${esc(r.score)}</div>${r.note?`<div class="nt">⚠ ${esc(r.note)}</div>`:''}</span></label></div>`).join(''):'<div class="hint">추천할 상품이 없습니다.</div>'}
    </div>
   </div>
   <div>
    <div class="card"><h2><span class="n">C</span>요약 편집 <span class="hint">(${c.summary_method==='llm'?'LLM':'규칙 기반'} 생성)</span></h2>
      <textarea id="body" ${locked?'disabled':''} style="min-height:230px">${esc(c.body)}</textarea>
      ${locked?'':`<div class="row"><button id="save" class="primary">변경사항 저장 → 미리보기 갱신</button><span class="hint" id="dirtyMsg"></span></div>`}
    </div>
    <div class="card"><h2><span class="n">D</span>고객 발송 미리보기 <span class="chip">${c.msg_type} · ${c.bytes}byte</span></h2>
      <div class="phone"><div class="bubble">${esc(c.final_text)}</div></div>
      ${Object.keys(c.residual).length?`<div class="err">⚠ 개인정보로 보이는 값이 남아 있습니다: ${esc(Object.keys(c.residual).join(', '))}</div>`:''}
    </div>
    <div class="card"><h2><span class="n">E</span>직원 최종 검토 · 승인 · 발송</h2>
      ${locked?`<div class="hint">${c.status==='SENT'?'발송 완료 (모의 발송: 실제 문자는 전송되지 않음) '+esc(c.sent_at):'반려됨'}</div>`:`
      <div class="checks">
        <label><input type="checkbox" data-k="masking_ok"> 마스킹되지 않은 개인정보가 없음을 확인했습니다</label>
        <label><input type="checkbox" data-k="content_ok"> 요약 내용이 실제 상담과 일치함을 확인했습니다</label>
        <label><input type="checkbox" data-k="recipient_ok"> 수신번호(${esc(c.recipient_masked)})가 고객 본인 번호임을 확인했습니다</label>
        ${needAd?`<label><input type="checkbox" data-k="ad_ok"> 광고 표기·수신거부 문구·수신 동의를 확인했습니다</label>`:''}
      </div>
      <div id="err2"></div>
      <div class="row">
        <button id="approve" class="primary" ${c.status!=='DRAFT'?'disabled':''}>검토 완료 · 승인</button>
        <button id="send" ${c.status!=='APPROVED'?'disabled':''} style="background:var(--ok);color:#fff;border-color:var(--ok)">고객에게 SMS 발송(모의)</button>
        <button id="reject" class="danger">반려</button>
      </div>
      <div class="hint">승인 후 내용을 바꾸면 승인이 자동 취소됩니다.</div>`}
      <div class="tl" style="margin-top:10px">${audit.map(a=>`<div><b>${esc(a.action)}</b> · ${esc(a.actor)} · ${a.ts.slice(11)} <span class="hint">${esc(a.detail)}</span></div>`).join('')}</div>
    </div>
   </div>
  </div>`;
  if(locked)return;
  const mark=()=>{dirty=true;$('#dirtyMsg').textContent='저장되지 않은 변경이 있습니다. 저장 후 승인할 수 있습니다.';$('#approve').disabled=true;$('#send').disabled=true};
  $('#body').oninput=mark;
  document.querySelectorAll('.recsel').forEach(x=>x.onchange=mark);
  const sel=()=>[...document.querySelectorAll('.recsel:checked')].map(x=>x.value);
  const guard=async fn=>{ $('#err2').innerHTML='';
    if(!uid()){$('#err2').innerHTML=errHtml({message:'상단에 직원 ID를 입력하세요.'});return}
    try{await fn();dirty=false;render();refresh()}
    catch(e){ if(e.payload&&e.payload.view){put(e.payload);render();refresh()} $('#err2').innerHTML=errHtml(e)}};
  $('#save').onclick=()=>guard(()=>act('edit',{body:$('#body').value,selected:sel()}));
  $('#addMask').onclick=()=>{const t=$('#extra').value.split(',').map(x=>x.trim()).filter(Boolean);if(t.length)guard(()=>act('edit',{extra_terms:t}))};
  $('#approve').onclick=()=>{const ck={};document.querySelectorAll('.checks input').forEach(x=>ck[x.dataset.k]=x.checked);
    guard(()=>act('approve',{checklist:ck}))};
  $('#send').onclick=()=>{if(confirm('고객에게 SMS를 발송합니다(모의). 계속할까요?'))guard(()=>act('send',{}))};
  $('#reject').onclick=()=>{const r=prompt('반려 사유를 입력하세요');if(r)guard(()=>act('reject',{reason:r}))};
}
init();
</script>
</body>
</html>
